name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please don't attach private drawings, personal information or credentials.
        Security issues should be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /draw
        2. Choose हिन्दी from the language menu
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [English, Hindi, Telugu, Bengali, Tamil, Marathi]
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: e.g. Safari 19 on iOS 19, Chrome 141 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Were you online or offline?
      options: [Online, Offline, Not sure]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
      description: Optional. Redact anything private.
